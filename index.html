<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live GPS Tracker</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000000;
      color: #ffffff;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    .coordinate-box {
      font-size: 2.5rem;
      font-weight: bold;
      margin: 20px 0;
      font-variant-numeric: tabular-nums;
    }
    .label {
      font-size: 1rem;
      color: #8e8e93;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .accuracy {
      font-size: 1.1rem;
      color: #34c759;
      margin-top: 10px;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    }
    button:active {
      background-color: #0056b3;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="setupScreen">
      <h1 style="margin-bottom: 30px;">GPS Receiver</h1>
      <button id="startBtn">Tap to Start GPS</button>
    </div>

    <div id="displayScreen" class="hidden">
      <div class="label">Latitude</div>
      <div id="latDisplay" class="coordinate-box">0.000000</div>

      <div class="label" style="margin-top: 40px;">Longitude</div>
      <div id="lonDisplay" class="coordinate-box">0.000000</div>

      <div id="accDisplay" class="accuracy">Waiting for signal...</div>
    </div>
  </div>

  <script>
    // Register Service Worker for Offline capability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.error('SW Registration Failed', err));
      });
    }

    let watchId = null;
    let wakeLock = null;

    const setupScreen = document.getElementById('setupScreen');
    const displayScreen = document.getElementById('displayScreen');
    const startBtn = document.getElementById('startBtn');
    const latDisplay = document.getElementById('latDisplay');
    const lonDisplay = document.getElementById('lonDisplay');
    const accDisplay = document.getElementById('accDisplay');

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.warn('Wake lock unsupported or rejected:', err.message);
      }
    }

    startBtn.addEventListener('click', async () => {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by this device.");
        return;
      }

      setupScreen.classList.add('hidden');
      displayScreen.classList.remove('hidden');
      await requestWakeLock();

      watchId = navigator.geolocation.watchPosition(
        (position) => {
          const { latitude, longitude, accuracy } = position.coords;
          latDisplay.innerText = latitude.toFixed(6);
          lonDisplay.innerText = longitude.toFixed(6);
          accDisplay.innerText = `Accurate to ± ${Math.round(accuracy)} meters`;
        },
        (error) => {
          accDisplay.innerText = `Error: ${error.message}`;
          accDisplay.style.color = '#ff3b30';
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    });
  </script>
</body>
</html>
