<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Live GPS Coordinate Display</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        /* Dark theme setup matching your background color #000000 */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            color: #FFFFFF; /* ?attr/colorOnSurface */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* ConstraintLayout Simulation View Container */
        .constraint-layout {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Base styles mimicking Android's TextView parameters */
        .text-view {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            text-align: center;
            font-weight: 500;
        }

        /* Mapping Android vertical bias constraints & text size (sp -> rem equivalent) */
        #text_lat {
            top: 30%; /* app:layout_constraintVertical_bias="0.3" */
            font-size: 2.2rem; /* approx 35sp scaling */
        }

        #text_lon {
            top: 40%; /* app:layout_constraintVertical_bias="0.4" */
            font-size: 2.2rem; /* approx 35sp scaling */
        }

        #text_mgrsZone100K {
            top: 60%; /* app:layout_constraintVertical_bias="0.6" */
            font-size: 2.5rem; /* approx 40sp scaling */
        }

        #text_mgrsEast {
            top: 70%; /* app:layout_constraintVertical_bias="0.7" */
            font-size: 2.5rem; /* approx 40sp scaling */
        }

        #text_mgrsNorth {
            top: 80%; /* app:layout_constraintVertical_bias="0.8" */
            font-size: 2.5rem; /* approx 40sp scaling */
        }

        /* Centered User Action Button required to unlock iOS Safari GPS permissions */
        #start_btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000000;
            background-color: #FFFFFF;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="constraint-layout">
        <!-- iOS Interaction Trigger Button -->
        <button id="start_btn" onclick="initializeGps()">Tap to Start GPS</button>

        <!-- Replicating exact active TextView layout configurations from Android XML -->
        <div id="text_lat" class="text-view">---</div>
        <div id="text_lon" class="text-view">---</div>
        <div id="text_mgrsZone100K" class="text-view">---</div>
        <div id="text_mgrsEast" class="text-view">---</div>
        <div id="text_mgrsNorth" class="text-view">---</div>
    </div>

    <!-- Register PWA Service Worker for full offline capabilities -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered successfully.', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>

    <!-- Load the locally cached proj4js/mgrs script asset -->
    <script src="./mgrs.js"></script>

    <!-- Geolocation tracking and data parsing pipeline logic -->
    <script>
        let watchId = null;
        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        function initializeGps() {
            // Hide the button so it clears out of the view layout space
            document.getElementById('start_btn').style.display = 'none';

            document.getElementById('text_lat').innerText = "Waiting for signal...";
            document.getElementById('text_lon').innerText = "Searching...";

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, geoOptions);
            } else {
                document.getElementById('text_lat').innerText = "GPS Not Supported";
            }
        }

        function onLocationSuccess(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // 1. Format and display Latitude exactly like your Android code
            let latitudeStr = latitude.toFixed(5);
            if (latitude > 0) {
                latitudeStr += "° N";
            } else if (latitude < 0) {
                latitudeStr += "° S";
            } else {
                latitudeStr += "°";
            }
            document.getElementById('text_lat').innerText = latitudeStr;

            // 2. Format and display Longitude exactly like your Android code
            let longitudeStr = longitude.toFixed(5);
            if (longitude > 0) {
                longitudeStr += "° E";
            } else if (longitude < 0) {
                longitudeStr += "° W";
            } else {
                longitudeStr += "°";
            }
            document.getElementById('text_lon').innerText = longitudeStr;

            // 3. Compute and Parse Offline MGRS String Values
            try {
                // Accuracy '5' ensures 1-meter precision matching Android app
                const rawMgrs = window.mgrs.forward([longitude, latitude], 5);
                console.log("Raw MGRS Output:", rawMgrs);

                if (rawMgrs && rawMgrs.length >= 13) {
                    // Find where the letter block starts (handles 1-digit zones or 2-digit zones like "53S")
                    const letterMatch = rawMgrs.match(/[A-Z]/);
                    if (letterMatch) {
                        const firstLetterIdx = letterMatch.index;
                        const gzdEndIdx = firstLetterIdx + 1; // Grid Zone end position

                        // Extract structural elements cleanly using character count positions
                        const mgrsZone     = rawMgrs.substring(0, gzdEndIdx);
                        const mgrs100K     = rawMgrs.substring(gzdEndIdx, gzdEndIdx + 2);

                        // Split remaining coordinate numbers right down the middle
                        const numericPart  = rawMgrs.substring(gzdEndIdx + 2);
                        const halfLength   = numericPart.length / 2;

                        const mgrsEasting  = numericPart.substring(0, halfLength);
                        const mgrsNorthing = numericPart.substring(halfLength);

                        // Push data to screens with identical Android application formatting
                        document.getElementById('text_mgrsZone100K').innerText = `${mgrsZone}  ${mgrs100K}`;
                        document.getElementById('text_mgrsEast').innerText = mgrsEasting;
                        document.getElementById('text_mgrsNorth').innerText = mgrsNorthing;
                    }
                }
            } catch (error) {
                console.error("MGRS Conversion failed: ", error);
            }
        }

        function onLocationError(error) {
            console.error(`Error (${error.code}): ${error.message}`);
            if (error.code === error.PERMISSION_DENIED) {
                document.getElementById('start_btn').style.display = 'block';
                alert("Location tracking access denied. Please enable location permissions.");
            }
            // Notice: your log showed "Position acquisition timed out" once, which is normal indoors.
            // It will update fine as soon as you step near a window or outdoors!
            document.getElementById('text_lat').innerText = "Signal Timeout";
            document.getElementById('text_lon').innerText = "Retrying location lock...";
        }
    </script>
</body>
</html>
