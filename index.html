<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MGRS座標</title>
    <link rel="manifest" href="./manifest.json">
    <!-- iOS Touch Icon -->
    <link rel="apple-touch-icon" href="icons/icon-any.svg" />

    <style>
        /* ==========================================================================
           1. DEFAULT GLOBAL LIGHT SETTINGS & VIEWPORT LAYOUT
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh; /* Uses Dynamic Viewport Height to prevent mobile toolbar clipping */
            background-color: #FFFFFF; /* Light surface background */
            color: #000000;            /* Default dark text color */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        .constraint-layout {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Base text configuration simulating Android's TextView layer mechanics */
        .text-view {
            position: absolute;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
            text-align: center;
            font-weight: 500;
        }

        .hidden {
            display: none !important;
        }

        /* ==========================================================================
           2. INTERACTIVE COMPONENT STYLING
           ========================================================================== */
        #start_btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #FFFFFF;
            background-color: #000000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s ease;
        }

        /* ==========================================================================
           3. VERTICAL CONSTRAINT BIASES & TYPOGRAPHY SCALING
           ========================================================================== */
        #gps_status       { top: 15%; font-size: 1.2rem; font-weight: bold; line-height: normal; }
        #text_lat         { top: 30%; }
        #text_lon         { top: 40%; }
        #text_mgrsZone100K { top: 60%; }
        #text_mgrsEast    { top: 70%; }
        #text_mgrsNorth   { top: 80%; }

        /* Grouped Typography scaling equivalents (Matches Android SP guidelines) */
        #text_lat, #text_lon {
            font-size: 2.1875rem; /* 35sp scaling standard */
        }
        #text_mgrsZone100K, #text_mgrsEast, #text_mgrsNorth {
            font-size: 2.5rem; /* 40sp scaling standard */
        }

        /* ==========================================================================
           4. STATUS THEMING LAYER (Light Mode Defs)
           ========================================================================== */
        .status-searching { color: #666666; }
        .status-warning   { color: #B38F00; }
        .status-locked    { color: #008844; }
        .status-error     { color: #CC0000; }

        /* ==========================================================================
           5. SYSTEM AUTOMATIC DARK THEME OVERRIDES
           ========================================================================== */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000000; /* Deep black surface */
                color: #E0E0E0;            /* Off-white text to reduce eye-strain */
            }

            #start_btn {
                color: #000000;
                background-color: #FFFFFF;
                box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
            }

            /* Overwrites high-contrast colors smoothly against the black screen */
            .status-searching { color: #A0A0A0; }
            .status-warning   { color: #FFCC00; }
            .status-locked    { color: #00FF88; }
            .status-error     { color: #FF5555; }
        }
    </style>
</head>

<body>

    <div class="constraint-layout">
        <!-- Bypass iOS Safari restrictions -->
        <button id="start_btn" onclick="initializeGps()">位置情報を取得</button>

        <div id="gps_status" class="text-view status-searching">🛰️ 位置情報未取得</div>
        <div id="text_lat" class="text-view">---</div>
        <div id="text_lon" class="text-view">---</div>
        <div id="text_mgrsZone100K" class="text-view">---</div>
        <div id="text_mgrsEast" class="text-view">---</div>
        <div id="text_mgrsNorth" class="text-view">---</div>
    </div>

    <!-- PWA Worker Layer to handle offline standalone cache executions -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered successfully.', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>

    <!-- Load the proj4js/mgrs script -->
    <script src="./mgrs.js"></script>

    <!-- Core Pipeline: Sensor extraction, format structures, calculation splits -->
    <script>
        let watchId = null;
        const geoOptions = {
            enableHighAccuracy: true, // Forces phone to use satellite hardware instead of cell towers
            timeout: 15000,           // Extends timeout loop slightly to prevent accidental canopy drops
            maximumAge: 0             // Strictly rejects cached positions for safety navigation
        };

        /**
         * Helper to switch status tracking classes cleanly
         */
        function updateStatus(text, className) {
            const el = document.getElementById('gps_status');
            el.innerText = text;
            el.className = 'text-view ' + className;
        }

        /**
         * Fires on button interaction to launch hardware feeds
         */
        function initializeGps() {
            document.getElementById('start_btn').style.display = 'none';
            updateStatus("🛰️ 衛星に接続中…", "status-warning");

            document.getElementById('text_lat').innerText = "信号を受信中…";
            document.getElementById('text_lon').innerText = "検索中…";

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition(onLocationSuccess, onLocationError, geoOptions);
            } else {
                updateStatus("❌ GPS機能が見つかりません", "status-error");
                document.getElementById('text_lat').innerText = "Not Supported";
            }
        }

        /**
         * Executed continuously by OS anytime a satellite refresh passes accuracy boundaries
         */
        function onLocationSuccess(position) {
            updateStatus("", "status-locked");

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            // 1. Process and format Latitude text like Android Kotlin/Java rules
            let latitudeStr = latitude.toFixed(5);
            if (latitude > 0) {
                latitudeStr += "° N";
            } else if (latitude < 0) {
                latitudeStr += "° S";
            } else {
                latitudeStr += "°";
            }
            document.getElementById('text_lat').innerText = latitudeStr;

            // 2. Process and format Longitude text like Android Kotlin/Java rules
            let longitudeStr = longitude.toFixed(5);
            if (longitude > 0) {
                longitudeStr += "° E";
            } else if (longitude < 0) {
                longitudeStr += "° W";
            } else {
                longitudeStr += "°";
            }
            document.getElementById('text_lon').innerText = longitudeStr;

            // 3. Mathematical Offline Conversion via proj4js/mgrs framework asset
            try {
                // Precision '5' guarantees 10-digit numeric chunks (1-meter high resolution)
                const rawMgrs = window.mgrs.forward([longitude, latitude], 5);
                console.log("Raw MGRS Output Trace:", rawMgrs);

                if (rawMgrs && rawMgrs.length >= 12) {
                    // Automatically locates the alphabetical band separator character boundary index
                    const letterMatch = rawMgrs.match(/[A-Z]/);
                    if (letterMatch) {
                        const firstLetterIdx = letterMatch.index;
                        const gzdEndIdx = firstLetterIdx + 1;

                        // Dynamic padding adjustment for single-digit UTM zones (e.g., "9Q" -> "09Q")
                        let mgrsZone = rawMgrs.substring(0, gzdEndIdx);
                        if (firstLetterIdx === 1) {
                            mgrsZone = "0" + mgrsZone;
                        }

                        const mgrs100K     = rawMgrs.substring(gzdEndIdx, gzdEndIdx + 2);

                        const numericPart  = rawMgrs.substring(gzdEndIdx + 2);
                        const halfLength   = numericPart.length / 2;

                        const mgrsEasting  = numericPart.substring(0, halfLength);
                        const mgrsNorthing = numericPart.substring(halfLength);

                        // Feed parsed fields straight into layout text elements
                        document.getElementById('text_mgrsZone100K').innerText = `${mgrsZone}  ${mgrs100K}`;
                        document.getElementById('text_mgrsEast').innerText = mgrsEasting;
                        document.getElementById('text_mgrsNorth').innerText = mgrsNorthing;
                    }
                }
            } catch (error) {
                console.error("Critical MGRS pipeline mathematical fault logic trace:", error);
            }
        }

        /**
         * Triggers dynamically if satellite lost or permissions crash out
         */
        function onLocationError(error) {
            console.error("Sensor Exception Code (" + error.code + "): " + error.message);

            if (error.code === error.PERMISSION_DENIED) {
                document.getElementById('start_btn').style.display = 'block';
                updateStatus("❌ 位置情報へのアクセス失敗", "status-error");
                alert("Please enable location permission tracking.");
            }
            else if (error.code === error.TIMEOUT) {
                updateStatus("⚠️ GPS信号ロスト", "status-error");
            }
        }
    </script>
</body>
</html>
