<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- 背景（rect）なし = 100% 透明 -->

  <g stroke="#000000" stroke-width="8" stroke-linecap="square">
    <!-- 垂直のグリッド線 -->
    <line x1="120" y1="60" x2="120" y2="452" />
    <line x1="194" y1="60" x2="194" y2="452" />
    <line x1="268" y1="60" x2="268" y2="452" />
    <line x1="342" y1="60" x2="342" y2="452" />
    <line x1="416" y1="60" x2="416" y2="452" />

    <!-- 水平のグリッド線 -->
    <line x1="60" y1="120" x2="452" y2="120" />
    <line x1="60" y1="194" x2="452" y2="194" />
    <line x1="60" y1="268" x2="452" y2="268" />
    <line x1="60" y1="342" x2="452" y2="342" />
    <line x1="60" y1="416" x2="452" y2="416" />
  </g>

  <!-- 左側の黒いドット -->
  <circle cx="268" cy="194" r="20" fill="#000000" />

  <!-- 右側のターゲットリング（中身は透明） -->
  <circle cx="342" cy="194" r="28" fill="none" stroke="#000000" stroke-width="8" />
</svg>
